[project]
name = "ai-fde"
version = "0.1.0"
description = "AI_FDE — turns a raw use case into a reviewed solution proposal pack"
authors = [
    { name = "ksh3001", email = "kiranshari74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-multipart>=0.0.12",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "openai>=1.54",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
ai-fde = "ai_fde.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_fde"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fpdf2>=2.8.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
